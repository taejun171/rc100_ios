<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>RC-100</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #3a3a3a;
    --line: #444;
    --text: #fff;
    --sub: #aaa;
    --idle: rgb(100, 100, 100);
    --active: rgb(0, 125, 255);
    --ok: #3c3;
    --stick: clamp(150px, min(52vh, 32vw), 260px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .title {
    font-size: 16px;
    font-weight: 700;
  }

  .status {
    margin-top: 2px;
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dot {
    flex: none;
    width: 12px;
    height: 12px;
    border-radius: 6px;
    background: #666;
  }

  .dot.on {
    background: var(--ok);
  }

  .show-all {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
  }

  header button {
    min-width: 84px;
    height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
  }

  header button:active {
    background: #555;
  }

  header button:disabled {
    opacity: 0.4;
  }

  .level {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 12px 24px 4px;
    touch-action: none;
  }

  .level-title {
    margin-top: 8px;
    font-size: 14px;
    color: var(--sub);
    white-space: nowrap;
  }

  .slider {
    position: relative;
    flex: 1;
    height: 56px;
    touch-action: none;
  }

  .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 14px;
    height: 8px;
    border-radius: 4px;
    background: var(--idle);
  }

  .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-radius: 4px;
    background: var(--active);
  }

  .thumb {
    position: absolute;
    top: 4px;
    width: 28px;
    height: 28px;
    margin-left: -14px;
    border-radius: 14px;
    background: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }

  .tick {
    position: absolute;
    top: 38px;
    width: 32px;
    margin-left: -16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--sub);
    text-align: center;
  }

  .tick.active {
    color: var(--text);
  }

  .level-value {
    min-width: 32px;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
  }

  #pad {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 16px 16px;
    touch-action: none;
  }

  .joystick {
    position: relative;
    flex: none;
    width: var(--stick);
    height: var(--stick);
    border: 2px solid var(--idle);
    border-radius: 50%;
    background: #262626;
    touch-action: none;
  }

  .joystick.active {
    border-color: var(--active);
  }

  .knob {
    position: absolute;
    left: 30%;
    top: 30%;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    background: var(--idle);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease-out;
  }

  .joystick.active .knob {
    background: var(--active);
    transition: none;
  }

  .dir {
    position: absolute;
    width: 20%;
    height: 20%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--stick) * 0.09);
    font-weight: 700;
    color: var(--sub);
  }

  .dir.active {
    color: var(--active);
  }

  .dir.up    { left: 40%; top: 0; }
  .dir.down  { left: 40%; bottom: 0; }
  .dir.left  { left: 0;   top: 40%; }
  .dir.right { right: 0;  top: 40%; }

  .side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .packet {
    font-family: Menlo, Consolas, monospace;
    font-size: 13px;
    color: #888;
  }

  .hint {
    max-width: 260px;
    font-size: 12px;
    color: #888;
    text-align: right;
  }

  .scan-panel {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
  }

  .scan-panel.open {
    display: flex;
  }

  .scan-box {
    display: flex;
    flex-direction: column;
    width: min(480px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    padding: 16px;
    border-radius: 14px;
    background: #2a2a2a;
  }

  .scan-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .scan-title {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
  }

  .scan-state {
    font-size: 13px;
    color: var(--sub);
  }

  .scan-list {
    flex: 1;
    min-height: 60px;
    overflow-y: auto;
  }

  .scan-item {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 12px;
    padding: 12px 8px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    text-align: left;
  }

  .scan-item:active {
    background: var(--panel);
  }

  .scan-mac {
    flex: 1;
    font-family: Menlo, Consolas, monospace;
    font-size: 16px;
    font-weight: 600;
  }

  .scan-sub {
    font-size: 12px;
    color: var(--sub);
    text-align: right;
  }

  .scan-empty {
    padding: 24px 0;
    color: #999;
    text-align: center;
  }

  .scan-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 12px;
  }

  .scan-buttons button {
    min-width: 84px;
    height: 40px;
    padding: 0 14px;
    border: 0;
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
  }

  @media (orientation: portrait) {
    :root {
      --stick: clamp(180px, min(72vw, 38vh), 300px);
    }

    header {
      flex-wrap: wrap;
    }

    .info {
      flex-basis: 100%;
    }

    .level {
      padding: 12px 20px 4px;
    }

    #pad {
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .side {
      order: -1;
      align-items: center;
    }

    .hint {
      text-align: center;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="info">
      <div class="title">RC-100 · ESP32 BLE</div>
      <div id="status" class="status">장치 없음</div>
    </div>
    <span id="dot" class="dot"></span>
    <label class="show-all"><input id="show-all" type="checkbox"> 전체 장치</label>
    <button id="btn-scan">검색</button>
    <button id="btn-connect">연결</button>
  </header>

  <section class="level">
    <div class="level-title">단계</div>
    <div id="slider" class="slider">
      <div class="track"><div id="fill" class="fill"></div></div>
      <div id="ticks"></div>
      <div id="thumb" class="thumb"></div>
    </div>
    <div id="level-value" class="level-value">0</div>
  </section>

  <main id="pad">
    <div id="joystick" class="joystick">
      <div class="dir up" data-key="1">U</div>
      <div class="dir left" data-key="4">L</div>
      <div class="dir right" data-key="8">R</div>
      <div class="dir down" data-key="2">D</div>
      <div id="knob" class="knob"></div>
    </div>

    <div class="side">
      <div id="packet" class="packet"></div>
      <div id="adv" class="hint"></div>
      <div id="hint" class="hint"></div>
    </div>
  </main>

  <div id="scan-panel" class="scan-panel">
    <div class="scan-box">
      <div class="scan-head">
        <div class="scan-title">GAEMI 로봇 검색</div>
        <div id="scan-state" class="scan-state"></div>
      </div>
      <div id="scan-list" class="scan-list"></div>
      <div class="scan-buttons">
        <button id="btn-picker">선택 창으로 검색</button>
        <button id="btn-scan-close">닫기</button>
      </div>
    </div>
  </div>

<script>
"use strict";

const BLE_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const BLE_WRITE_UUID   = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const ROBOTIS_COMPANY_ID = 0x07cf;
const ROBOTIS_MFG_SUFFIX = 0x05;
const ROBOTIS_MFG_LENGTH = 7;
const DEVICE_NAME_PREFIX = "GAEMI";

const CONNECT_TIMEOUT_MS = 20000;
const LE_SCAN_TIMEOUT_MS = 10000;

const LOOP_INTERVAL = 10;

const BLE_SEND_INTERVAL = 30;

const RC100_KEY_U = 1;
const RC100_KEY_D = 2;
const RC100_KEY_L = 4;
const RC100_KEY_R = 8;
const RC100_KEY_1 = 16;
const RC100_KEY_2 = 32;
const RC100_KEY_3 = 64;
const RC100_KEY_4 = 128;
const RC100_KEY_5 = 256;

const LEVEL_DATA = [
  0,
  RC100_KEY_1 | RC100_KEY_5,
  RC100_KEY_2 | RC100_KEY_5,
  RC100_KEY_3 | RC100_KEY_5,
  RC100_KEY_4 | RC100_KEY_5,
  RC100_KEY_3 | RC100_KEY_4 | RC100_KEY_5,
];
const LEVEL_MAX = LEVEL_DATA.length - 1;

const STICK_SECTORS = [
  RC100_KEY_R,
  RC100_KEY_U | RC100_KEY_R,
  RC100_KEY_U,
  RC100_KEY_U | RC100_KEY_L,
  RC100_KEY_L,
  RC100_KEY_D | RC100_KEY_L,
  RC100_KEY_D,
  RC100_KEY_D | RC100_KEY_R,
];
const STICK_DEADZONE = 0.3;
const STICK_TRAVEL = 0.6;
const STICK_GRAB = 1.15;

const $ = (id) => document.getElementById(id);
const dirEls = Array.from(document.querySelectorAll(".dir"));

let holdBits = 0;
let level = 0;

function btnData() {
  return holdBits | LEVEL_DATA[level];
}

function makePacket(bits) {
  const low = bits & 0xff;
  const high = (bits >> 8) & 0xff;
  return new Uint8Array([0xff, 0x55, low, 255 - low, high, 255 - high]);
}

function render() {
  const bits = btnData();
  for (const el of dirEls) {
    el.classList.toggle("active", (bits & Number(el.dataset.key)) !== 0);
  }
  $("packet").textContent = Array.from(makePacket(bits),
      (b) => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");

  const percent = level / LEVEL_MAX * 100 + "%";
  $("thumb").style.left = percent;
  $("fill").style.width = percent;
  $("level-value").textContent = level;
  for (const el of tickEls) {
    el.classList.toggle("active", Number(el.dataset.level) === level);
  }
}

const slider = $("slider");
const tickEls = [];

for (let i = 0; i <= LEVEL_MAX; i++) {
  const el = document.createElement("div");
  el.className = "tick";
  el.dataset.level = i;
  el.style.left = i / LEVEL_MAX * 100 + "%";
  el.textContent = i;
  $("ticks").appendChild(el);
  tickEls.push(el);
}

function setLevelAt(x) {
  const r = slider.getBoundingClientRect();
  const ratio = Math.min(Math.max((x - r.left) / r.width, 0), 1);
  const next = Math.round(ratio * LEVEL_MAX);
  if (next !== level) {
    level = next;
    render();
  }
}

slider.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  slider.setPointerCapture(e.pointerId);
  setLevelAt(e.clientX);
});

slider.addEventListener("pointermove", (e) => {
  if (slider.hasPointerCapture(e.pointerId)) setLevelAt(e.clientX);
});

const levelEl = document.querySelector(".level");
levelEl.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
levelEl.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

const joystick = $("joystick");
const knob = $("knob");
let stickPointer = null;

function setHold(bits) {
  if (bits !== holdBits) {
    holdBits = bits;
    render();
  }
}

function stickOffset(x, y) {
  const r = joystick.getBoundingClientRect();
  const radius = r.width / 2;
  return { dx: x - (r.left + radius), dy: y - (r.top + radius), radius };
}

function moveStick(x, y) {
  let { dx, dy, radius } = stickOffset(x, y);
  const dist = Math.hypot(dx, dy);
  const travel = radius * STICK_TRAVEL;
  if (dist > travel) {
    dx *= travel / dist;
    dy *= travel / dist;
  }
  knob.style.transform = "translate(" + dx + "px, " + dy + "px)";

  if (dist < radius * STICK_DEADZONE) {
    setHold(0);
    return;
  }
  const sector = Math.round(Math.atan2(-dy, dx) / (Math.PI / 4));
  setHold(STICK_SECTORS[(sector + 8) % 8]);
}

function releaseStick() {
  stickPointer = null;
  joystick.classList.remove("active");
  knob.style.transform = "";
  setHold(0);
}

const pad = $("pad");

pad.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (stickPointer !== null) return;
  const { dx, dy, radius } = stickOffset(e.clientX, e.clientY);
  if (Math.hypot(dx, dy) > radius * STICK_GRAB) return;
  stickPointer = e.pointerId;
  pad.setPointerCapture(e.pointerId);
  joystick.classList.add("active");
  moveStick(e.clientX, e.clientY);
});

pad.addEventListener("pointermove", (e) => {
  if (e.pointerId === stickPointer) moveStick(e.clientX, e.clientY);
});

for (const type of ["pointerup", "pointercancel"]) {
  pad.addEventListener(type, (e) => {
    if (e.pointerId === stickPointer) releaseStick();
  });
}

pad.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
pad.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    releaseStick();
  } else {
    requestWakeLock();
  }
});

let device = null;
let writeChar = null;
let isConnected = false;
let isBusy = false;
let isTxBusy = false;
let isClosing = false;
let statusText = "";
let advMac = "";
let advRssi = null;
let advCount = 0;
let advState = "";
let advRaw = "";
let watchedDevice = null;

function errorMessage(e) {
  return e && e.message ? e.message : String(e);
}

function setStatus(text) {
  statusText = text;
  updateUi();
}

function updateUi() {
  let name = device ? (device.name || DEVICE_NAME_PREFIX) : "장치 없음";
  if (device && advMac) name += " · " + advMac;
  if (device && advRssi !== null) name += " · " + advRssi + " dBm";
  $("status").textContent = name + (statusText ? "  |  " + statusText : "");
  $("dot").classList.toggle("on", isConnected);
  $("btn-scan").disabled = isBusy || isConnected;
  $("btn-connect").disabled = isBusy;
  $("btn-connect").textContent = isConnected ? "연결 해제" : "연결";
  updateAdvInfo();
}

function updateAdvInfo() {
  if (device === null) {
    $("adv").textContent = "";
    return;
  }
  let text = "광고: " + (advState || "-");
  if (advCount > 0) {
    text += " · " + advCount + "회";
    text += " · 제조사 데이터 " + (advRaw || "없음");
  }
  $("adv").textContent = text;
}

function hex(dataView) {
  const bytes = [];
  for (let i = 0; i < dataView.byteLength; i++) {
    bytes.push(dataView.getUint8(i).toString(16).padStart(2, "0").toUpperCase());
  }
  return bytes.join(" ");
}

function withTimeout(promise, ms, message) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(message)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

async function requestRobot() {
  if ($("show-all").checked) {
    return navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_SERVICE_UUID],
      optionalManufacturerData: [ROBOTIS_COMPANY_ID],
    });
  }
  try {
    return await navigator.bluetooth.requestDevice({
      filters: [
        { manufacturerData: [{ companyIdentifier: ROBOTIS_COMPANY_ID }] },
        { namePrefix: DEVICE_NAME_PREFIX },
      ],
      optionalServices: [BLE_SERVICE_UUID],
      optionalManufacturerData: [ROBOTIS_COMPANY_ID],
    });
  } catch (e) {
    if (e.name !== "TypeError") throw e;
    return navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: DEVICE_NAME_PREFIX }, { services: [BLE_SERVICE_UUID] }],
      optionalServices: [BLE_SERVICE_UUID],
      optionalManufacturerData: [ROBOTIS_COMPANY_ID],
    });
  }
}

function parseMac(manufacturerData) {
  const data = manufacturerData && manufacturerData.get(ROBOTIS_COMPANY_ID);
  if (!data || data.byteLength < ROBOTIS_MFG_LENGTH
      || data.getUint8(ROBOTIS_MFG_LENGTH - 1) !== ROBOTIS_MFG_SUFFIX) {
    return "";
  }
  const bytes = [];
  for (let i = 0; i < 6; i++) bytes.push(data.getUint8(i).toString(16).padStart(2, "0"));
  return bytes.join(":").toUpperCase();
}

function onAdvertisement(e) {
  if (e.device !== device) return;
  advCount++;
  advState = "수신 중";
  if (typeof e.rssi === "number") advRssi = e.rssi;

  const raw = [];
  if (e.manufacturerData) {
    e.manufacturerData.forEach((view, id) => {
      raw.push("0x" + id.toString(16).padStart(4, "0").toUpperCase() + " [" + hex(view) + "]");
    });
  }
  advRaw = raw.join(", ");

  const mac = parseMac(e.manufacturerData);
  if (mac) advMac = mac;
  updateUi();
}

let leScan = null;
let leScanTimer = null;
const leFound = new Map();

function isLeScanSupported() {
  return !!navigator.bluetooth && typeof navigator.bluetooth.requestLEScan === "function";
}

function openScanPanel() {
  $("scan-panel").classList.add("open");
}

function closeScanPanel() {
  stopLeScan();
  $("scan-panel").classList.remove("open");
}

function setScanState(text) {
  $("scan-state").textContent = text;
}

function renderScanList() {
  const list = $("scan-list");
  list.textContent = "";

  const entries = Array.from(leFound.values()).sort((a, b) => b.rssi - a.rssi);
  if (entries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "scan-empty";
    empty.textContent = leScan ? "검색 중..." : "검색된 장치 없음";
    list.appendChild(empty);
    return;
  }

  for (const entry of entries) {
    const item = document.createElement("button");
    item.className = "scan-item";

    const mac = document.createElement("div");
    mac.className = "scan-mac";
    mac.textContent = entry.mac || entry.name;

    const sub = document.createElement("div");
    sub.className = "scan-sub";
    sub.textContent = (entry.mac ? entry.name + " · " : "") + entry.rssi + " dBm";

    item.append(mac, sub);
    item.addEventListener("click", () => {
      closeScanPanel();
      connect(entry.device, entry);
    });
    list.appendChild(item);
  }
}

function onScanAdvertisement(e) {
  if (leScan === null) return;
  const mac = parseMac(e.manufacturerData);
  const name = e.name || (e.device && e.device.name) || "";
  if (!$("show-all").checked && !mac && !name.toUpperCase().startsWith(DEVICE_NAME_PREFIX)) return;

  const prev = leFound.get(e.device.id);
  leFound.set(e.device.id, {
    device: e.device,
    mac: mac || (prev ? prev.mac : ""),
    name: name || DEVICE_NAME_PREFIX,
    rssi: typeof e.rssi === "number" ? e.rssi : (prev ? prev.rssi : -127),
  });
  renderScanList();
}

async function startLeScan() {
  stopLeScan();
  leFound.clear();
  openScanPanel();
  setScanState("검색 중...");

  const options = $("show-all").checked
    ? { acceptAllAdvertisements: true, keepRepeatedDevices: true }
    : {
        filters: [
          { manufacturerData: [{ companyIdentifier: ROBOTIS_COMPANY_ID }] },
          { namePrefix: DEVICE_NAME_PREFIX },
        ],
        keepRepeatedDevices: true,
      };

  try {
    try {
      leScan = await navigator.bluetooth.requestLEScan(options);
    } catch (e) {
      if (e.name !== "TypeError") throw e;
      leScan = await navigator.bluetooth.requestLEScan(
          { acceptAllAdvertisements: true, keepRepeatedDevices: true });
    }
  } catch (e) {
    leScan = null;
    if (e.name === "NotFoundError" || e.name === "AbortError") {
      closeScanPanel();
      return;
    }
    setScanState("");
    $("scan-list").innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "scan-empty";
    empty.textContent = "목록 검색 실패 (" + errorMessage(e) + "). '선택 창으로 검색' 을 누르세요.";
    $("scan-list").appendChild(empty);
    return;
  }

  navigator.bluetooth.addEventListener("advertisementreceived", onScanAdvertisement);
  renderScanList();
  leScanTimer = setTimeout(() => {
    stopLeScan();
    setScanState(leFound.size > 0 ? leFound.size + "개 장치 검색됨" : "");
    renderScanList();
  }, LE_SCAN_TIMEOUT_MS);
}

function stopLeScan() {
  clearTimeout(leScanTimer);
  leScanTimer = null;
  if (navigator.bluetooth) {
    navigator.bluetooth.removeEventListener("advertisementreceived", onScanAdvertisement);
  }
  if (leScan !== null) {
    try {
      leScan.stop();
    } catch (e) {}
    leScan = null;
  }
}

async function watchAdvertisements(target) {
  if (target === watchedDevice) return;
  if (typeof target.watchAdvertisements !== "function") {
    advState = "브라우저 미지원";
    updateAdvInfo();
    return;
  }
  try {
    target.addEventListener("advertisementreceived", onAdvertisement);
    advState = "시작 중";
    updateAdvInfo();
    await target.watchAdvertisements();
    watchedDevice = target;
    if (advCount === 0) advState = "대기 중 (수신 없음)";
  } catch (e) {
    target.removeEventListener("advertisementreceived", onAdvertisement);
    advState = "시작 실패 (" + (e.name || "") + " " + errorMessage(e) + ")";
  }
  updateAdvInfo();
}

async function scan() {
  if (isBusy) return;
  if (!navigator.bluetooth) {
    setStatus("Web Bluetooth 미지원 (iPhone 은 Bluefy 로 여세요)");
    return;
  }
  if (isLeScanSupported()) {
    await startLeScan();
  } else {
    await scanWithPicker();
  }
}

async function scanWithPicker() {
  let picked;
  try {
    picked = await requestRobot();
  } catch (e) {
    setStatus(e.name === "NotFoundError" ? "" : "검색 실패 (" + errorMessage(e) + ")");
    return;
  }
  await connect(picked);
}

async function connect(target, found) {
  if (isBusy) return;
  await closeDevice();

  isBusy = true;
  if (target !== device) {
    target.addEventListener("gattserverdisconnected", onDisconnected);
    advMac = found ? found.mac : "";
    advRssi = found ? found.rssi : null;
    advCount = 0;
    advState = "";
    advRaw = "";
  }
  device = target;
  watchAdvertisements(target);
  setStatus("연결 중...");

  try {
    const server = await withTimeout(device.gatt.connect(), CONNECT_TIMEOUT_MS, "시간 초과");
    let service;
    try {
      service = await server.getPrimaryService(BLE_SERVICE_UUID);
      writeChar = await service.getCharacteristic(BLE_WRITE_UUID);
    } catch (e) {
      isClosing = true;
      device.gatt.disconnect();
      isClosing = false;
      if (e.name === "SecurityError") {
        throw new Error("서비스 접근 권한 없음. 검색 목록의 '선택 창으로 검색' 으로 다시 연결하세요");
      }
      throw new Error("GAEMI BLE 장치가 아닙니다");
    }
    isTxBusy = false;
    isConnected = true;
    statusText = "연결됨";
    requestWakeLock();
  } catch (e) {
    writeChar = null;
    isConnected = false;
    statusText = "연결 실패 (" + errorMessage(e) + ")";
  } finally {
    isBusy = false;
    updateUi();
  }
}

function onDisconnected() {
  if (isClosing || !isConnected) return;
  writeChar = null;
  isConnected = false;
  isTxBusy = false;
  setStatus("연결 끊김");
}

async function closeDevice() {
  writeChar = null;
  isConnected = false;
  isTxBusy = false;
  if (device && device.gatt.connected) {
    isClosing = true;
    try {
      device.gatt.disconnect();
    } finally {
      isClosing = false;
    }
  }
}

async function onConnectPress() {
  if (isBusy) return;
  if (isConnected) {
    await closeDevice();
    setStatus("연결 해제됨");
    return;
  }
  if (device !== null) {
    await connect(device);
  } else {
    await scan();
  }
}

function send(packet) {
  if (writeChar === null || isTxBusy) return false;

  isTxBusy = true;
  const write = writeChar.writeValueWithoutResponse
    ? writeChar.writeValueWithoutResponse(packet)
    : writeChar.writeValue(packet);
  write
    .catch((e) => console.log("BLE 전송 실패: " + errorMessage(e)))
    .finally(() => { isTxBusy = false; });
  return true;
}

let preBtnData = -1;
let preSendTime = 0;

setInterval(() => {
  const bits = btnData();
  if (isConnected) {
    const now = Date.now();
    if (bits !== preBtnData || now - preSendTime >= BLE_SEND_INTERVAL) {
      if (send(makePacket(bits))) preSendTime = now;
    }
  }
  preBtnData = bits;
}, LOOP_INTERVAL);

let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock !== null || document.hidden) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {
    wakeLock = null;
  }
}

$("btn-scan").addEventListener("click", scan);
$("btn-connect").addEventListener("click", onConnectPress);
$("btn-scan-close").addEventListener("click", closeScanPanel);
$("btn-picker").addEventListener("click", () => {
  closeScanPanel();
  scanWithPicker();
});

try {
  $("show-all").checked = localStorage.getItem("rc100/show_all") === "1";
} catch (e) {}
$("show-all").addEventListener("change", () => {
  try {
    localStorage.setItem("rc100/show_all", $("show-all").checked ? "1" : "0");
  } catch (e) {}
});

if (!navigator.bluetooth) {
  $("hint").textContent = "이 브라우저는 Web Bluetooth 를 지원하지 않습니다. iPhone 은 Bluefy 앱으로 이 페이지를 여세요.";
} else if (!window.isSecureContext) {
  $("hint").textContent = "Web Bluetooth 는 HTTPS 에서만 동작합니다.";
}

updateUi();
render();
</script>
</body>
</html>
