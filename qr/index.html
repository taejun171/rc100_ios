<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>RC-100</title>
<style>
  html { background: #1e1e1e; color: #fff; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<noscript>JavaScript 를 켜야 합니다.</noscript>
<script>
/*
 * RC-100 QR 로더 (iPhone Safari + beacio 전용)
 *
 * QR 코드 = 이 페이지 주소 + "#" + 앱 전체 (app.html 을 최소화 → raw deflate → 10진수).
 * 이 페이지는 주소의 # 뒤를 풀어서 띄우기만 하고, 조종기 화면과 코드는 모두 QR 안에 있습니다.
 * # 뒤는 서버로 전송되지 않습니다.
 *
 * 로더가 필요한 이유: Web Bluetooth 는 HTTPS 페이지에서만 동작합니다 (beacio 도 HTTPS 페이지에만
 * navigator.bluetooth 를 넣습니다). QR 에 HTML 을 data: URL 로 넣으면 origin 이 null 이고
 * isSecureContext 가 false 라서 navigator.bluetooth 가 없고, 아이폰 카메라도 data: URL 을 열어주지 않습니다.
 *
 * 앱이 바뀌어도 이 파일은 바꿀 필요가 없습니다. QR 만 다시 만들면 됩니다 (build.mjs).
 *
 * 인터넷 없이 쓰기: 처음 한 번 인터넷으로 열 때 sw.js 가 이 로더를 휴대폰에 저장합니다.
 * 그 다음부터는 비행기 모드에서도 QR 만 찍으면 열립니다.
 */
(() => {
  "use strict";

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  const BEACIO_URL = "https://apps.apple.com/app/id6761301368";
  const LINK = 'style="color:#4da3ff"';
  const BUTTON = 'style="height:44px;padding:0 18px;border:0;border-radius:8px;' +
    'background:#007dff;color:#fff;font:600 15px system-ui,sans-serif"';

  // 같은 탭에서 다른 QR 을 열면 # 만 바뀌고 페이지는 다시 읽히지 않으므로 새로 읽습니다.
  addEventListener("hashchange", () => location.reload());

  function show(html) {
    document.body.innerHTML =
      '<div style="max-width:520px;margin:0 auto;padding:24px 20px;line-height:1.6;font-size:15px">' +
      html + "</div>";
  }

  function info() {
    show('<h2 style="font-size:19px">RC-100 QR 로더</h2>' +
      "<p>조종기 QR 코드를 iPhone 카메라로 찍어서 여는 페이지입니다.</p>" +
      '<p><a href="../" ' + LINK + ">전체 버전 열기</a></p>");
  }

  function fail(e) {
    show('<h2 style="font-size:19px">QR 데이터를 읽지 못했습니다</h2>' +
      "<p>QR 코드를 다시 찍어 주세요.</p>" +
      '<p id="err" style="color:#aaa;font-size:13px"></p>');
    document.getElementById("err").textContent = String(e && e.message || e);
  }

  // Safari 가 아닌 곳: 아이폰의 Chrome / Firefox / Edge / Google 앱, 카카오톡 · 네이버 등 앱 안 브라우저, 안드로이드, PC
  function isIosSafari() {
    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    return ios && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|DuckDuckGo/.test(ua);
  }

  // navigator.bluetooth 가 없음 = beacio 가 없거나, 꺼져 있거나, 이 사이트를 허용하지 않음
  function guide() {
    const notSafari = !isIosSafari();
    show('<h2 style="font-size:19px;margin:0 0 12px">' +
      (notSafari ? "iPhone Safari 에서 열어 주세요" : "beacio 를 켜야 합니다") + "</h2>" +
      (notSafari
        ? "<p>RC-100 조종기는 <b>iPhone Safari</b> 전용입니다. 카카오톡 · 네이버 앱이나 Chrome 에서 열렸다면 " +
          "<b>링크 복사</b> 를 누르고 Safari 주소창에 붙여넣으세요.</p>" +
          '<p><button id="copy" ' + BUTTON + ">링크 복사</button></p>" +
          '<textarea id="url" readonly rows="3" style="width:100%;box-sizing:border-box;' +
          'background:#2a2a2a;color:#aaa;border:0;border-radius:8px;padding:8px;font-size:12px"></textarea>' +
          "<p><b>Safari 에서 처음 쓸 때</b></p>"
        : "<p>RC-100 조종기는 Safari 확장 프로그램 <b>beacio</b> 로 블루투스를 씁니다.</p>") +
      '<ol style="padding-left:20px">' +
      '<li>App Store 에서 무료 앱 <a href="' + BEACIO_URL + '" ' + LINK + ">beacio</a> 를 설치합니다.</li>" +
      "<li>Safari 주소창의 <b>가가 (aA)</b> 버튼 → <b>확장 프로그램 관리</b> → <b>beacio</b> 를 켭니다.</li>" +
      "<li>다시 <b>가가 (aA)</b> → <b>beacio</b> → <b>항상 허용</b> → <b>모든 웹 사이트에서</b> 를 고릅니다. " +
      '<span style="color:#aaa">("하루 동안 허용" 은 다음 날부터 동작하지 않습니다)</span></li>' +
      "<li>아래 <b>다시 열기</b> 를 누릅니다.</li></ol>" +
      '<p><button id="reload" ' + BUTTON + ">다시 열기</button></p>");

    document.getElementById("reload").onclick = () => location.reload();
    const copy = document.getElementById("copy");
    if (!copy) return;
    const url = document.getElementById("url");
    url.value = location.href;
    copy.onclick = async () => {
      let ok = false;
      try {
        await navigator.clipboard.writeText(location.href);
        ok = true;
      } catch (e) {
        url.readOnly = false;
        url.focus();
        url.setSelectionRange(0, url.value.length);
        try { ok = document.execCommand("copy"); } catch (e2) {}
        url.readOnly = true;
      }
      copy.textContent = ok ? "복사됨" : "아래 주소를 길게 눌러 복사하세요";
    };
  }

  // 10진수 → 바이트. 맨 앞 16진수 한 자리 "1" 은 앞쪽 0 바이트를 지키기 위한 표시입니다.
  function digitsToBytes(digits) {
    if (!/^[0-9]+$/.test(digits)) throw new Error("숫자가 아닌 데이터가 있습니다");
    const hex = BigInt(digits).toString(16);
    if (hex[0] !== "1" || hex.length % 2 !== 1) throw new Error("데이터 형식이 맞지 않습니다");
    const bytes = new Uint8Array((hex.length - 1) / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(1 + i * 2, 2), 16);
    return bytes;
  }

  // raw deflate 풀기 (Safari 16.4+ 내장)
  async function inflate(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(stream).arrayBuffer());
  }

  // document.write 대신 지금 문서에 옮겨 넣습니다. document.open() 은 window / document 의
  // 이벤트 리스너를 지우므로, 확장 프로그램 (beacio) 이 넣어둔 Web Bluetooth 구현이 깨질 수 있습니다.
  function run(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const scripts = Array.from(doc.querySelectorAll("script"));
    for (const s of scripts) s.remove();
    if (doc.title) document.title = doc.title;
    for (const n of Array.from(doc.head.childNodes)) {
      if (n.nodeName !== "TITLE") document.head.append(n);
    }
    document.body.replaceWith(doc.body);
    for (const s of scripts) {
      const n = document.createElement("script");
      n.textContent = s.textContent;
      document.body.append(n);
    }
  }

  async function main() {
    const data = location.hash.slice(1);
    if (!data) return info();
    // beacio 는 페이지 스크립트보다 먼저 navigator.bluetooth 를 넣지만, 늦는 경우를 위해 잠깐 기다립니다.
    if (!navigator.bluetooth) await new Promise((r) => setTimeout(r, 300));
    if (!navigator.bluetooth) return guide();
    let html;
    try {
      html = await inflate(digitsToBytes(data));
    } catch (e) {
      return fail(e);
    }
    run(html);
  }

  if (document.readyState === "complete") main();
  else addEventListener("load", main);
})();
</script>
</body>
</html>
